
<!DOCTYPE html>

<head>

<body>

    <div class="container">

        <div class="title">

        <div class="heart" id="heart">
            <svg viewBox="0 0 200 180">
                <defs>
                    <linearGradient id="heartGradient"
                        x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFB6D0"/>
                        <stop offset="50%" stop-color="#F44383"/>
                        <stop offset="100%" stop-color="#C2185B"/>
                    </linearGradient>
                </defs>

                <path d="M100 170
                C80 145 10 100 10 55
                C10 5 75 -5 100 40
                C125 -5 190 5 190 55
                C190 100 120 145 100 170 Z"/>
            </svg>

            <div class="message" id="message">
                Ti voglio bene
            </div>
        </div>

        <div class="subtitle">UN PICCOLO PENSIERO PER <b>LUCREZIA</b>
            <br>
            <p class="subtitle-1">Le amicizie d’infanzia sono quelle che durano per sempre. E sono le migliori.</p>
            <p class="subtitle-2">FATTO CON ❤️ DA TOMMY</p>
            <p class="subtitle-2">PER UNA VERA AMICA</p>
        </div>

        <div class="info">Sito realizzato interamente a mano da Tommy, utilizzando codice web e linguaggio di programmazione.</div>

    </div>
